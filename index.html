<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>田畑式タイマー</title>
<meta name="theme-color" content="#e11d48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabata">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f5f7; --fg: #1b1f24; --card: #fff; --muted: #6b7280;
    --prep: #f59e0b; --work: #e11d48; --rest: #2563eb; --done: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --fg: #f1f3f5; --card: #1c2128; --muted: #9aa4b2; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; flex-direction: column; align-items: center;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  main { width: 100%; max-width: 480px; padding: 16px; }
  h1 { font-size: 1.1rem; text-align: center; margin: 8px 0 16px; }
  .stage {
    --c: var(--prep);
    background: var(--c); color: #fff; border-radius: 20px; padding: 24px 16px;
    text-align: center; transition: background .25s;
  }
  .stage[data-phase="work"] { --c: var(--work); }
  .stage[data-phase="rest"] { --c: var(--rest); }
  .stage[data-phase="done"] { --c: var(--done); }
  .stage[data-phase="idle"] { --c: #6b7280; }
  #label { font-size: 1.6rem; font-weight: 700; letter-spacing: .1em; }
  #time { font-size: clamp(5rem, 28vw, 8rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #round { font-size: 1.1rem; opacity: .95; }
  .bar { height: 8px; background: rgba(255,255,255,.3); border-radius: 4px; margin-top: 16px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: #fff; }
  .controls { display: flex; gap: 8px; margin: 16px 0; }
  button {
    flex: 1; padding: 14px; font-size: 1rem; font-weight: 700; border: 0; border-radius: 12px;
    background: var(--fg); color: var(--bg); cursor: pointer;
  }
  button.sub { background: var(--card); color: var(--fg); border: 1px solid var(--muted); }
  .settings { background: var(--card); border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center; }
  .settings label { color: var(--muted); font-size: .9rem; }
  .settings input { width: 80px; padding: 8px; font-size: 16px; text-align: right; border-radius: 8px; border: 1px solid var(--muted); background: var(--bg); color: var(--fg); }
  p.note { color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>田畑式タイマー(Tabata)</h1>

  <section class="stage" id="stage" data-phase="idle">
    <div id="label">READY</div>
    <div id="time">50</div>
    <div id="round">50秒運動 / 10秒休憩 × 5ラウンド</div>
    <div class="bar"><i id="fill"></i></div>
  </section>

  <div class="controls">
    <button id="start">スタート</button>
    <button id="reset" class="sub">リセット</button>
  </div>

  <section class="settings">
    <label for="prepSec">準備(秒)</label><input id="prepSec" type="number" min="0" max="60" value="5" autocomplete="off">
    <label for="workSec">運動(秒)</label><input id="workSec" type="number" min="1" max="600" value="50" autocomplete="off">
    <label for="restSec">休憩(秒)</label><input id="restSec" type="number" min="0" max="600" value="10" autocomplete="off">
    <label for="rounds">ラウンド数</label><input id="rounds" type="number" min="1" max="99" value="5" autocomplete="off">
  </section>
  <p class="note">初期設定は 準備5秒 + 50秒運動 / 10秒休憩 × 5ラウンド。設定はこの端末に保存されます。音が出ます。</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $("stage"), label = $("label"), timeEl = $("time"), roundEl = $("round"), fill = $("fill");
  const startBtn = $("start"), resetBtn = $("reset");
  const inputs = { prep: $("prepSec"), work: $("workSec"), rest: $("restSec"), rounds: $("rounds") };
  const LABELS = { prep: "PREPARE", work: "WORK!", rest: "REST", done: "FINISH", idle: "READY" };

  let seq = [], idx = 0, phaseEnd = 0, remainingMs = 0, timer = null, running = false, lastShown = null;
  let audio = null, wakeLock = null;

  const val = (el, min, max) => Math.min(max, Math.max(min, parseInt(el.value, 10) || 0));

  // 設定はクッキーに1年保存する。既定値はこちらが正
  const DEFAULTS = { prep: 5, work: 50, rest: 10, rounds: 5 };
  const COOKIE = "tabata2";
  function saveSettings() {
    const data = { prep: inputs.prep.value, work: inputs.work.value, rest: inputs.rest.value, rounds: inputs.rounds.value };
    document.cookie = COOKIE + "=" + encodeURIComponent(JSON.stringify(data)) + ";max-age=31536000;path=/;SameSite=Lax";
  }
  function loadSettings() {
    const hit = document.cookie.split("; ").find(c => c.startsWith(COOKIE + "="));
    let data = {};
    try {
      if (hit) data = JSON.parse(decodeURIComponent(hit.slice(COOKIE.length + 1)));
    } catch (e) {}
    // ブラウザが前回の入力値を復元することがあるので、必ず上書きする
    Object.keys(inputs).forEach(k => { inputs[k].value = data[k] != null ? data[k] : DEFAULTS[k]; });
  }

  function build() {
    const prep = val(inputs.prep, 0, 60), work = val(inputs.work, 1, 600),
          rest = val(inputs.rest, 0, 600), rounds = val(inputs.rounds, 1, 99);
    seq = [];
    if (prep) seq.push({ type: "prep", sec: prep, round: 0 });
    for (let r = 1; r <= rounds; r++) {
      seq.push({ type: "work", sec: work, round: r });
      if (rest && r < rounds) seq.push({ type: "rest", sec: rest, round: r });
    }
    seq.rounds = rounds;
  }

  // 無音WAVをループ再生すると、iOSがメディア再生扱いにしてマナーモードでもWebAudioが鳴る
  let silentEl = null;
  function silentWav() {
    const n = 8000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVEfmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, "data"); v.setUint32(40, n, true);
    new Uint8Array(buf, 44).fill(128);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  // タップ操作の中で呼ぶ。スマホは操作内でresumeしないと音が出ない
  function unlockAudio() {
    try {
      if (!silentEl) { silentEl = new Audio(silentWav()); silentEl.loop = true; silentEl.setAttribute("playsinline", ""); }
      silentEl.play().catch(() => {});
    } catch (e) {}
    try {
      if (navigator.audioSession) navigator.audioSession.type = "playback"; // iOS: マナーモードでも鳴らす
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state !== "running") audio.resume();
      const b = audio.createBuffer(1, 1, 22050), s = audio.createBufferSource();
      s.buffer = b; s.connect(audio.destination); s.start(0);
    } catch (e) {}
  }

  function beep(freq, ms) {
    try {
      if (navigator.vibrate) navigator.vibrate(Math.min(ms, 200));
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state !== "running") audio.resume();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.type = "square"; // 倍音を含めて小型スピーカーでも抜けやすく
      const t = audio.currentTime, dur = ms / 1000;
      g.gain.setValueAtTime(.001, t);
      g.gain.exponentialRampToValueAtTime(.22, t + .005); // 立ち上がりのプチッという音を防ぐ
      g.gain.setValueAtTime(.22, t + dur * .7);           // 減衰は終盤だけ。短い音が痩せないように
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(t + dur);
    } catch (e) {}
  }

  function render(ms) {
    const p = seq[idx];
    const secs = Math.ceil(ms / 1000);
    timeEl.textContent = secs;
    fill.style.width = (100 - ms / (p.sec * 1000) * 100) + "%";
    if (secs !== lastShown) {
      lastShown = secs;
      if (secs > 0 && secs <= 3) beep(2640, 200); // ワーク開始と同じ高さ。長さ(200ms対400ms)で区別
    }
  }

  function showPhase() {
    const p = seq[idx];
    stage.dataset.phase = p.type;
    label.textContent = LABELS[p.type];
    roundEl.textContent = p.type === "prep" ? "まもなく開始" : `ラウンド ${p.round} / ${seq.rounds}`;
    lastShown = null;
    beep(p.type === "work" ? 2640 : 1760, 400);
  }

  function tick() {
    let ms = phaseEnd - performance.now();
    while (ms <= 0) {
      idx++;
      if (idx >= seq.length) return finish();
      showPhase();
      phaseEnd += seq[idx].sec * 1000;
      ms = phaseEnd - performance.now();
    }
    render(ms);
  }

  function finish() {
    stop();
    stage.dataset.phase = "done";
    label.textContent = LABELS.done;
    timeEl.textContent = "0";
    roundEl.textContent = "おつかれさまでした!";
    fill.style.width = "100%";
    beep(2093, 200); setTimeout(() => beep(2093, 200), 300); setTimeout(() => beep(2640, 500), 600);
    startBtn.textContent = "もう一度";
    idx = -1;
  }

  async function lock() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  function unlock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

  function stop() { clearInterval(timer); timer = null; running = false; unlock(); }

  function start() {
    unlockAudio();
    if (running) { // pause
      remainingMs = phaseEnd - performance.now();
      stop(); startBtn.textContent = "再開"; return;
    }
    if (idx < 0 || !seq.length || stage.dataset.phase === "idle") {
      build(); idx = 0; showPhase(); remainingMs = seq[0].sec * 1000;
    }
    phaseEnd = performance.now() + remainingMs;
    running = true; lock();
    timer = setInterval(tick, 100); tick();
    startBtn.textContent = "一時停止";
  }

  function reset() {
    stop(); build(); idx = 0; remainingMs = 0;
    stage.dataset.phase = "idle"; label.textContent = LABELS.idle;
    timeEl.textContent = val(inputs.work, 1, 600);
    roundEl.textContent = `${val(inputs.work,1,600)}秒運動 / ${val(inputs.rest,0,600)}秒休憩 × ${val(inputs.rounds,1,99)}ラウンド`;
    fill.style.width = "0"; startBtn.textContent = "スタート";
    idx = -1;
  }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  document.addEventListener("visibilitychange", () => { if (running && !document.hidden) { lock(); if (audio && audio.state !== "running") audio.resume(); } });
  startBtn.addEventListener("click", start);
  resetBtn.addEventListener("click", reset);
  Object.values(inputs).forEach(el => el.addEventListener("change", () => { saveSettings(); if (!running) reset(); }));
  loadSettings();
  reset();
})();
</script>
</body>
</html>
